<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>

*{
-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -10%,#172554 0%,transparent 35%),
radial-gradient(circle at 100% 30%,#0f1d38 0%,transparent 30%),
#060b14;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

/* ================= HEADER ================= */

.header{
text-align:center;
padding:32px 15px 25px;
}

.logo-box{
display:inline-flex;
align-items:center;
justify-content:center;
gap:12px;
padding:13px 25px;
border-radius:18px;
background:linear-gradient(
135deg,
rgba(30,41,59,.95),
rgba(15,23,42,.95)
);
border:1px solid rgba(96,165,250,.22);
box-shadow:
0 15px 40px rgba(0,0,0,.35),
inset 0 1px rgba(255,255,255,.05);
}

.logo-dot{
width:11px;
height:11px;
border-radius:50%;
background:#ef4444;
box-shadow:0 0 15px #ef4444;
animation:pulseDot 1.5s infinite;
}

.logo-text{
font-size:clamp(1.35rem,4vw,2rem);
font-weight:800;
letter-spacing:-.04em;
color:#fff;
}

.subtitle{
margin-top:12px;
font-size:12px;
font-weight:600;
letter-spacing:.22em;
color:#64748b;
}

/* ================= TELEGRAM ================= */

.social-links{
display:flex;
justify-content:center;
margin-top:17px;
}

.social-link{
display:inline-flex;
align-items:center;
gap:7px;
padding:8px 16px;
border-radius:999px;
background:rgba(19,29,47,.8);
border:1px solid rgba(42,171,238,.2);
color:#dbeafe;
font-size:12px;
font-weight:600;
text-decoration:none;
transition:.25s;
box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.social-link:hover{
transform:translateY(-2px);
background:#172a43;
border-color:#2aabee;
box-shadow:0 10px 30px rgba(42,171,238,.12);
}

.social-link svg{
width:15px;
height:15px;
}

.social-link.tg-link svg{
fill:#29b6f6;
}

/* ================= MATCH GRID ================= */

#matches-container{
max-width:1200px;
margin:20px auto 50px;
}

/* ================= MATCH CARD ================= */

.match-tile{
position:relative;
background:
linear-gradient(
145deg,
rgba(19,29,47,.98),
rgba(10,17,29,.98)
);
border-radius:24px;
border:1px solid #1e293b;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:
0 18px 45px rgba(0,0,0,.35),
inset 0 1px rgba(255,255,255,.025);
transition:
transform .3s ease,
border-color .3s ease,
box-shadow .3s ease;
}

.match-tile:hover{
transform:translateY(-6px);
border-color:rgba(59,130,246,.65);
box-shadow:
0 25px 55px rgba(0,0,0,.5),
0 0 30px rgba(37,99,235,.08);
}

/* ================= IMAGE ================= */

.img-wrapper{
height:215px;
position:relative;
overflow:hidden;
background:#0f172a;
}

.img-wrapper::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(5,10,18,.75),
transparent 55%
);
pointer-events:none;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .5s ease;
}

.match-tile:hover .match-img{
transform:scale(1.05);
}

/* ================= BADGES ================= */

.live-badge,
.scheduled-badge{
position:absolute;
top:13px;
left:13px;
z-index:2;
display:inline-flex;
align-items:center;
gap:6px;
padding:6px 11px;
border-radius:999px;
font-size:10px;
font-weight:700;
letter-spacing:.04em;
backdrop-filter:blur(10px);
}

.live-badge{
background:rgba(185,28,28,.92);
color:#fff;
box-shadow:0 5px 20px rgba(185,28,28,.25);
animation:liveBlink 1.5s infinite;
}

.scheduled-badge{
background:rgba(15,23,42,.82);
border:1px solid rgba(148,163,184,.2);
color:#cbd5e1;
}

/* ================= CARD CONTENT ================= */

.match-content{
padding:20px;
display:flex;
flex-direction:column;
flex:1;
}

.match-title{
font-size:18px;
line-height:1.4;
font-weight:700;
color:#f8fafc;
margin:0;
}

.tournament{
font-size:12px;
color:#64748b;
margin-top:7px;
}

.match-time{
display:flex;
align-items:center;
gap:6px;
font-size:12px;
color:#94a3b8;
margin-top:8px;
}

/* ================= WATCH BUTTON ================= */

.watch-btn{
width:100%;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
border:1px solid rgba(96,165,250,.25);
border-radius:13px;
padding:12px;
font-size:13px;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
margin-top:16px;
cursor:pointer;
color:#fff;
transition:.25s;
box-shadow:0 8px 22px rgba(37,99,235,.16);
}

.watch-btn:hover{
background:linear-gradient(135deg,#3b82f6,#2563eb);
transform:translateY(-2px);
box-shadow:0 12px 28px rgba(37,99,235,.25);
}

.watch-btn:active{
transform:scale(.98);
}

.not-live{
background:#172235;
border-color:#243248;
color:#64748b;
cursor:not-allowed;
pointer-events:none;
box-shadow:none;
}

/* ================= QUALITY MODAL ================= */

#qualityModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

#qualityModal.hidden{
display:none;
}

#qualityModal .modal-content{
width:100%;
max-width:380px;
background:
linear-gradient(
145deg,
#111827,
#080d16
);
border:1px solid rgba(96,165,250,.16);
border-radius:22px;
padding:24px;
text-align:center;
box-shadow:
0 30px 80px rgba(0,0,0,.8),
0 0 40px rgba(37,99,235,.05);
}

#qualityModal h2{
font-size:20px;
font-weight:700;
margin:0 0 18px;
color:#f8fafc;
}

#qualityList{
display:flex;
flex-direction:column;
gap:9px;
}

.quality-item{
background:#172235;
border:1px solid #26354b;
border-radius:13px;
padding:13px 16px;
font-size:15px;
font-weight:600;
color:#e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.quality-item::after{
content:"›";
font-size:20px;
line-height:10px;
color:#64748b;
}

.quality-item:hover{
background:#2563eb;
border-color:#3b82f6;
color:#fff;
transform:translateY(-1px);
}

.quality-item:hover::after{
color:#fff;
}

#qualityModal .btn{
width:100%;
margin-top:16px;
background:#1f2937;
color:#cbd5e1;
border:1px solid #334155;
border-radius:12px;
padding:11px;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

#qualityModal .btn:hover{
background:#ef4444;
border-color:#ef4444;
color:#fff;
}

/* ================= TELEGRAM POPUP ================= */

#tgOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.86);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:none;
align-items:center;
justify-content:center;
z-index:999999;
padding:20px;
animation:fadeInPopup .35s ease;
}

#tgOverlay.show{
display:flex;
}

#tgCard{
width:100%;
max-width:400px;
background:
linear-gradient(
160deg,
#121a27,
#080d15
);
border:1px solid rgba(79,195,247,.15);
border-radius:25px;
padding:32px 26px 26px;
box-shadow:
0 40px 90px rgba(0,0,0,.8),
0 0 60px rgba(79,195,247,.04);
text-align:center;
position:relative;
overflow:hidden;
}

#tgCard::before{
content:"";
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:radial-gradient(
circle at 30% 20%,
rgba(79,195,247,.06),
transparent 55%
);
pointer-events:none;
}

#tgIcon{
width:68px;
height:68px;
margin:0 auto 17px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#2aabee,#229ed9);
box-shadow:
0 0 35px rgba(42,171,238,.2);
position:relative;
z-index:1;
}

#tgIcon svg{
width:34px;
height:34px;
}

#tgCard h2{
margin:0 0 8px;
font-size:1.45rem;
font-weight:700;
color:#fff;
position:relative;
z-index:1;
}

#tgCard p{
margin:0 0 22px;
color:#8491a5;
font-size:.9rem;
line-height:1.6;
position:relative;
z-index:1;
}

.tgBtns{
display:flex;
gap:10px;
position:relative;
z-index:1;
}

.tgBtn{
flex:1;
height:47px;
border-radius:13px;
font-weight:700;
font-size:.85rem;
cursor:pointer;
transition:.25s;
font-family:'Poppins',sans-serif;
}

#joinNow{
background:linear-gradient(135deg,#4fc3f7,#2196f3);
color:#fff;
border:none;
box-shadow:0 7px 25px rgba(79,195,247,.2);
}

#joinNow:hover{
transform:translateY(-2px);
box-shadow:0 10px 30px rgba(79,195,247,.3);
}

#joinedBtn{
background:rgba(255,255,255,.04);
color:#8e9baf;
border:1px solid rgba(255,255,255,.08);
}

#joinedBtn:hover{
background:rgba(255,255,255,.08);
color:#fff;
}

/* ================= ANIMATIONS ================= */

@keyframes liveBlink{
0%,100%{
opacity:1;
}
50%{
opacity:.45;
}
}

@keyframes pulseDot{
0%,100%{
transform:scale(1);
opacity:1;
}
50%{
transform:scale(.7);
opacity:.6;
}
}

@keyframes fadeInPopup{
from{
opacity:0;
transform:scale(.95) translateY(12px);
}
to{
opacity:1;
transform:scale(1) translateY(0);
}
}

/* ================= MOBILE ================= */

@media(max-width:640px){

height:195px;

.match-title{
font-size:16px;

.watch-btn{
padding:11px;
font-size:12px;

#qualityModal .modal-content{
padding:21px 18px;
}

#tgCard{
padding:25px 18px 20px;
border-radius:21px;
}

#tgIcon{
width:60px;
height:60px;

#tgIcon svg{
width:30px;
height:30px;
}

#tgCard h2{
font-size:1.2rem;
}

#tgCard p{
font-size:.82rem;
margin-bottom:18px;
}

.tgBtn{
height:43px;
font-size:.78rem;
}

}

</style>
</head>

<script>

const DATA_URL =
'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';

const PLAYER_URL =
'fc-play.html?data=';

const container =
document.getElementById("matches-container");

let allMatches = [];


/* ================= LOAD MATCHES ================= */

fetch(DATA_URL)

.then(res => res.json())

.then(data => {

allMatches = data.matches || [];

container.innerHTML = "";

const matches =
allMatches.sort((a,b) => {

const aLive =
(a.status || "").toUpperCase() === "LIVE";

const bLive =
(b.status || "").toUpperCase() === "LIVE";

return bLive - aLive;

});


matches.forEach((m,index) => {

const isLive =
(m.status || "").toUpperCase() === "LIVE";

const img =
m.image ||
"https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";


const card =
document.createElement("div");

card.className =
"match-tile";


card.innerHTML = `

<div class="img-wrapper">

<img
src="${img}"
class="match-img"
loading="lazy"
>

${
isLive

?

'<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'

:

'<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'

}

</div>


<div class="match-content">

<h3 class="match-title">
${m.title || 'Match'}
</h3>

<div class="tournament">
${m.tournament || ''}
</div>

<div class="match-time">

<i class="far fa-clock"></i>

${formatDate(m.startTime)}

</div>


${
isLive

?

`

<div
onclick="openQuality(${index})"
class="watch-btn"
>

<i class="fas fa-play"></i>

WATCH NOW

</div>

`

:

`

<div class="watch-btn not-live">

<i class="far fa-clock"></i>

NOT LIVE

</div>

`

}

</div>

`;


container.appendChild(card);

});

})

.catch(() => {

container.innerHTML =

"<p class='text-center col-span-full text-gray-500 py-10'>Failed to load matches</p>";

});


/* ================= DATE FORMAT ================= */

function formatDate(time){

if(!time) return "";

const parts =
time.match(
/(\d{2}):(\d{2}):(\d{2})\s*(AM|PM)\s*(\d{2})-(\d{2})-(\d{4})/i
);


if(parts){

let [
,
hh,
mm,
ss,
ampm,
dd,
mo,
yyyy
] = parts;


hh =
parseInt(hh,10);


if(
ampm.toUpperCase() === 'PM' &&
hh < 12
)
hh += 12;


if(
ampm.toUpperCase() === 'AM' &&
hh === 12
)
hh = 0;


const d =
new Date(
yyyy,
parseInt(mo,10)-1,
parseInt(dd,10),
hh,
parseInt(mm,10),
parseInt(ss,10)
);


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


const d =
new Date(time);


if(isNaN(d))
return time;


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* ================= QUALITY ================= */

function openQuality(index){

const match =
allMatches[index];


const streams =
match.auto_streams &&
match.auto_streams.ENGLISH &&
match.auto_streams.ENGLISH.streams;


if(
!streams ||
Object.keys(streams).length === 0
){

alert("Stream not available");

return;

}


const list =
document.getElementById("qualityList");


list.innerHTML = "";


const order = [
'1080p',
'720p',
'540p',
'480p',
'360p',
'240p'
];


const sortedKeys =
Object.keys(streams).sort(
(a,b) =>
order.indexOf(b) -
order.indexOf(a)
);


sortedKeys.forEach(q => {

const btn =
document.createElement("div");


btn.className =
"quality-item";


btn.innerText =
q;


btn.onclick =
function(){

const encoded =
btoa(streams[q]);


window.location.href =
PLAYER_URL +
encodeURIComponent(encoded);

};


list.appendChild(btn);

});


document
.getElementById("qualityModal")
.classList
.remove("hidden");

}


function closeQuality(){

document
.getElementById("qualityModal")
.classList
.add("hidden");

}


/* ================= TELEGRAM POPUP ================= */

(function(){

const tgOverlay =
document.getElementById('tgOverlay');


function closePopup(){

tgOverlay.classList.remove('show');

}


/* Show popup after 3 seconds */

setTimeout(function(){

tgOverlay.classList.add('show');

},3000);


/* Join Now */

document
.getElementById('joinNow')
.onclick =
function(){

window.open(
'https://t.me/cricmatchstream',
'_blank'
);

closePopup();

};


/* Already Joined */

document
.getElementById('joinedBtn')
.onclick =
function(){

closePopup();

};


/* Click backdrop */

tgOverlay.addEventListener(
'click',
function(e){

if(e.target === tgOverlay){

closePopup();

}

}
);


/* ESC */

document.addEventListener(
'keydown',
function(e){

if(
e.key === 'Escape' &&
tgOverlay.classList.contains('show')
){

closePopup();

}

}
);

})();

        const message = "JOIN OUR TELEGRAM CHANNEL FOR MORE LIVE STREAM LINKS";
        if (confirm(message)) {
            window.location.href = "https://t.me/cricmatchstream";
        }
  

</script>
