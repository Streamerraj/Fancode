<style>

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
-webkit-tap-highlight-color:transparent;
box-sizing:border-box;
}

html,
body{
margin:0;
padding:0;
background:#0a0f1c;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

button{
font-family:'Poppins',sans-serif;
}

/* =========================
HEADER
========================= */

.header{
text-align:center;
margin-top:20px;
margin-bottom:32px;
}

.brand{
display:inline-flex;
align-items:center;
justify-content:center;
background:#131d2f;
padding:12px 28px;
border-radius:50px;
border:1px solid rgba(59,130,246,.35);
}

.brand span{
font-size:30px;
font-weight:800;
color:#fff;
letter-spacing:-.5px;
}

.subtitle{
color:#6b7280;
font-size:13px;
margin-top:12px;
letter-spacing:1px;
}

/* =========================
TELEGRAM LINK
========================= */

.social-links{
display:flex;
align-items:center;
justify-content:center;
margin-top:12px;
}

.social-link{
display:inline-flex;
align-items:center;
gap:7px;
padding:7px 15px;
background:#131d2f;
border:1px solid #253247;
border-radius:50px;
color:#e5e7eb;
font-size:12px;
font-weight:600;
text-decoration:none;
transition:.25s;
}

.social-link:hover{
background:#17253b;
border-color:#3b82f6;
transform:translateY(-2px);
}

.social-link svg{
width:14px;
height:14px;
fill:#29b6f6;
}

/* =========================
MATCH GRID
========================= */

#matches-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

.match-tile{
background:#131d2f;
border-radius:28px;
border:1px solid #253247;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 15px 30px -10px rgba(0,0,0,.8);
transition:.25s;
}

.match-tile:hover{
background:#17253b;
border-color:#3b82f6;
transform:translateY(-4px);
box-shadow:0 25px 40px -8px #1e3a8a40;
}

.img-wrapper{
height:210px;
overflow:hidden;
position:relative;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.live-badge{
position:absolute;
top:12px;
left:12px;
background:#b91c1c;
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
0%{opacity:1}
50%{opacity:.3}
100%{opacity:1}
}

.scheduled-badge{
position:absolute;
top:12px;
left:12px;
background:rgba(0,0,0,.65);
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
}

.match-info{
padding:20px;
display:flex;
flex-direction:column;
flex:1;
}

.match-title{
font-size:19px;
font-weight:700;
}

.tournament{
font-size:14px;
color:#9ca3af;
margin-top:7px;
}

.match-time{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}

.watch-btn{
background:#2563eb;
border-radius:50px;
padding:12px;
font-weight:600;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
margin-top:15px;
cursor:pointer;
transition:.2s;
}

.watch-btn:hover{
background:#1d4ed8;
transform:translateY(-1px);
}

.not-live{
background:#334155;
cursor:not-allowed;
pointer-events:none;
}

/* =========================
PLAYER OVERLAY
========================= */

#playerOverlay{
position:fixed;
inset:0;
background:#000;
display:none;
z-index:99998;
overflow-y:auto;
}

#playerOverlay.show{
display:block;
}

.player-header{
height:60px;
background:#0b1220;
display:flex;
align-items:center;
gap:15px;
padding:0 16px;
border-bottom:1px solid #253247;
position:sticky;
top:0;
z-index:5;
}

.back-btn{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#172235;
color:white;
font-size:19px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.back-btn:hover{
background:#2563eb;
}

.player-title{
font-size:16px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.player-area{
width:100%;
max-width:1100px;
margin:0 auto;
padding:20px;
}

/* VIDEO */

.video-box{
width:100%;
background:#000;
border-radius:16px;
overflow:hidden;
position:relative;
box-shadow:0 20px 60px rgba(0,0,0,.6);
}

#videoPlayer{
width:100%;
height:auto;
min-height:220px;
max-height:75vh;
background:#000;
display:block;
}

/* =========================
PLAYER QUALITY
========================= */

.quality-panel{
margin-top:18px;
background:#111827;
border:1px solid #253247;
border-radius:18px;
padding:16px;
}

.quality-title{
font-size:15px;
font-weight:600;
margin-bottom:12px;
color:#fff;
}

.quality-buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.quality-btn{
background:#1f2937;
border:1px solid #334155;
color:#e5e7eb;
padding:10px 18px;
border-radius:12px;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

.quality-btn:hover{
background:#2563eb;
border-color:#2563eb;
}

.quality-btn.active{
background:#2563eb;
border-color:#60a5fa;
color:#fff;
box-shadow:0 0 15px rgba(37,99,235,.3);
}

.quality-btn.auto{
background:#334155;
}

.stream-status{
font-size:12px;
color:#9ca3af;
margin-top:12px;
}

/* =========================
LOADING
========================= */

#playerLoading{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.45);
z-index:2;
}

#playerLoading.hidden{
display:none;
}

.loader{
width:42px;
height:42px;
border:4px solid rgba(255,255,255,.2);
border-top-color:#2563eb;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* =========================
TELEGRAM POPUP
========================= */

#tgOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:none;
align-items:center;
justify-content:center;
z-index:999999;
padding:20px;
}

#tgOverlay.show{
display:flex;
}

#tgCard{
width:100%;
max-width:400px;
background:linear-gradient(160deg,#121821,#0a0c0f);
border:1px solid rgba(79,195,247,.15);
border-radius:24px;
padding:36px 28px 28px;
box-shadow:0 40px 80px rgba(0,0,0,.8);
text-align:center;
}

#tgIcon{
width:72px;
height:72px;
margin:0 auto 16px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#2AABEE,#229ED9);
}

#tgIcon svg{
width:36px;
height:36px;
}

#tgCard h2{
margin:0 0 8px;
font-size:1.6rem;
font-weight:700;
color:#fff;
}

#tgCard p{
margin:0 0 24px;
color:#8e9baf;
font-size:.95rem;
line-height:1.6;
}

.tgBtns{
display:flex;
gap:12px;
}

.tgBtn{
flex:1;
height:48px;
border-radius:40px;
font-weight:700;
cursor:pointer;
border:none;
}

#joinNow{
background:linear-gradient(135deg,#4fc3f7,#2196f3);
color:#fff;
}

#joinedBtn{
background:rgba(255,255,255,.05);
color:#8e9baf;
border:1px solid rgba(255,255,255,.08);

/* =========================
MOBILE
========================= */

@media(max-width:900px){

#matches-container{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

body{
padding:16px!important;
}

.brand span{
font-size:24px;
}

#matches-container{
grid-template-columns:1fr;
gap:22px;
}

.img-wrapper{
height:200px;
}

.player-area{
padding:10px;
}

.player-header{
height:56px;
padding:0 10px;
}

.player-title{
font-size:14px;
}

.video-box{
border-radius:10px;
}

#videoPlayer{
min-height:200px;
}

.quality-panel{
border-radius:14px;
padding:13px;
}

.quality-buttons{
gap:8px;
}

.quality-btn{
padding:9px 13px;
font-size:13px;
}

#tgCard{
padding:24px 18px 20px;
}

#tgIcon{
width:60px;
height:60px;
}

#tgCard h2{
font-size:1.2rem;
}

}

</style>
</head>

<script>

/* =====================================================
DATA
===================================================== */

const DATA_URL =
'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';


const container =
document.getElementById("matches-container");


const playerOverlay =
document.getElementById("playerOverlay");


const video =
document.getElementById("videoPlayer");


const qualityButtons =
document.getElementById("qualityButtons");


const playerTitle =
document.getElementById("playerTitle");


const playerLoading =
document.getElementById("playerLoading");


const streamStatus =
document.getElementById("streamStatus");


let allMatches = [];

let currentStreams = {};

let currentQuality = null;

let hls = null;


/* =====================================================
LOAD MATCHES
===================================================== */

fetch(DATA_URL)

.then(res => {

if(!res.ok){

throw new Error("Failed to load JSON");

}

return res.json();

})

.then(data => {

allMatches =
data.matches || [];

container.innerHTML = "";


/* LIVE FIRST */

allMatches.sort((a,b) => {

const aLive =
(a.status || "").toUpperCase() === "LIVE";

const bLive =
(b.status || "").toUpperCase() === "LIVE";

return bLive - aLive;

});


allMatches.forEach((m,index) => {

const isLive =
(m.status || "").toUpperCase() === "LIVE";


const img =
m.image ||
"https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";


const card =
document.createElement("div");


card.className =
"match-tile";


card.innerHTML = `

<div class="img-wrapper">

<img
src="${img}"
class="match-img"
loading="lazy"
>

${
isLive

?

'<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'

:

'<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'
}

</div>


<div class="match-info">

<div class="match-title">
${m.title || "Match"}
</div>

<div class="tournament">
${m.tournament || ""}
</div>

<div class="match-time">
${formatDate(m.startTime)}
</div>


${
isLive

?

`

<div
class="watch-btn"
onclick="openPlayer(${index})"
>

<i class="fas fa-play"></i>

WATCH NOW

</div>

`

:

`

<div class="watch-btn not-live">

<i class="far fa-clock"></i>

NOT LIVE

</div>

`

}

</div>

`;


container.appendChild(card);

});

})


.catch(error => {

console.error(error);

container.innerHTML = `

<p class="text-center"
style="grid-column:1/-1;color:#9ca3af;">

Failed to load matches

</p>

`;

});


/* =====================================================
DATE FORMAT
===================================================== */

function formatDate(time){

if(!time) return "";


const parts =
time.match(
/(\d{2}):(\d{2}):(\d{2})\s*(AM|PM)\s*(\d{2})-(\d{2})-(\d{4})/i
);


if(parts){

let [
_,
hh,
mm,
ss,
ampm,
dd,
mo,
yyyy
] = parts;


hh =
parseInt(hh,10);


if(
ampm.toUpperCase() === "PM" &&
hh < 12
){

hh += 12;

}


if(
ampm.toUpperCase() === "AM" &&
hh === 12
){

hh = 0;

}


const d =
new Date(
yyyy,
parseInt(mo,10)-1,
parseInt(dd,10),
hh,
parseInt(mm,10),
parseInt(ss,10)
);


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


const d =
new Date(time);


if(isNaN(d)){

return time;

}


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
OPEN PLAYER
===================================================== */

function openPlayer(index){

const match =
allMatches[index];


const streams =
match.auto_streams &&
match.auto_streams.ENGLISH &&
match.auto_streams.ENGLISH.streams;


if(
!streams ||
Object.keys(streams).length === 0
){

alert("Stream not available");

return;

}


/* SAVE STREAMS */

currentStreams =
streams;


/* TITLE */

playerTitle.innerText =
match.title || "FANCODE LIVE";


/* OPEN PLAYER */

playerOverlay.classList.add("show");


document.body.style.overflow =
"hidden";


/* CREATE QUALITY BUTTONS */

createQualityButtons();


/* SELECT HIGHEST AVAILABLE */

const order = [

"1080p",
"720p",
"540p",
"480p",
"360p",
"240p"

];


let firstQuality = null;


for(
const q of order
){

if(currentStreams[q]){

firstQuality = q;

break;

}

}


/* FALLBACK */

if(!firstQuality){

firstQuality =
Object.keys(currentStreams)[0];

}


/* START */

if(firstQuality){

loadQuality(firstQuality);

}

}


/* =====================================================
CREATE QUALITY BUTTONS
===================================================== */

function createQualityButtons(){

qualityButtons.innerHTML = "";


/* QUALITY ORDER */

const order = [

"1080p",
"720p",
"540p",
"480p",
"360p",
"240p"

];


const available =
Object.keys(currentStreams);


/* SORT */

const sorted =
available.sort((a,b) => {

const ai =
order.indexOf(a);

const bi =
order.indexOf(b);

if(ai === -1 && bi === -1){

return 0;

}

if(ai === -1){

return 1;

}

if(bi === -1){

return -1;

}

return ai - bi;

});


/* CREATE */

sorted.forEach(quality => {

const btn =
document.createElement("button");


btn.className =
"quality-btn";


btn.innerText =
quality;


btn.onclick =
function(){

loadQuality(quality);

};


qualityButtons.appendChild(btn);

});

}


/* =====================================================
LOAD QUALITY
===================================================== */

function loadQuality(quality){

const streamURL =
currentStreams[quality];


if(!streamURL){

return;

}


currentQuality =
quality;


/* ACTIVE BUTTON */

document
.querySelectorAll(".quality-btn")
.forEach(btn => {

btn.classList.remove("active");

if(btn.innerText === quality){

btn.classList.add("active");

}

});


streamStatus.innerText =
"Loading " + quality + " stream...";


playerLoading.classList.remove("hidden");


/* SAVE CURRENT TIME */

const currentTime =
video.currentTime || 0;


const wasPlaying =
!video.paused;


/* DESTROY OLD HLS */

if(hls){

try{

hls.destroy();

}catch(e){}

hls = null;

}


/* RESET */

video.pause();

video.removeAttribute("src");

video.load();


/* =========================
HLS.JS
========================= */

if(
window.Hls &&
Hls.isSupported()
){

hls =
new Hls({

enableWorker:true,

lowLatencyMode:true,

backBufferLength:30,

maxBufferLength:30

});


hls.loadSource(streamURL);

hls.attachMedia(video);


hls.on(
Hls.Events.MANIFEST_PARSED,
function(){

playerLoading.classList.add("hidden");

streamStatus.innerText =
"Playing " + quality;


try{

video.currentTime =
currentTime;

}catch(e){}


if(wasPlaying){

video.play().catch(()=>{});

}

});


hls.on(
Hls.Events.ERROR,
function(event,data){

console.error(
"HLS error:",
data
);

if(data.fatal){

playerLoading.classList.add("hidden");

streamStatus.innerText =
"Stream error on " + quality;

}

});

}


/* =========================
NATIVE HLS
========================= */

else if(
video.canPlayType(
"application/vnd.apple.mpegurl"
)
){

video.src =
streamURL;


video.addEventListener(
"loadedmetadata",
function(){

playerLoading.classList.add("hidden");

streamStatus.innerText =
"Playing " + quality;


try{

video.currentTime =
currentTime;

}catch(e){}


if(wasPlaying){

video.play().catch(()=>{});

}

},
{once:true}
);

}


/* =========================
DIRECT VIDEO
========================= */

else{

video.src =
streamURL;


video.addEventListener(
"loadedmetadata",
function(){

playerLoading.classList.add("hidden");

streamStatus.innerText =
"Playing " + quality;


if(wasPlaying){

video.play().catch(()=>{});

}

},
{once:true}
);

}

}


/* =====================================================
CLOSE PLAYER
===================================================== */

function closePlayer(){

if(hls){

try{

hls.destroy();

}catch(e){}

hls = null;

}


video.pause();

video.removeAttribute("src");

video.load();


playerOverlay.classList.remove("show");


document.body.style.overflow =
"";


currentStreams = {};

currentQuality = null;

qualityButtons.innerHTML = "";

}


/* =====================================================
ESCAPE PLAYER
===================================================== */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "Escape" &&
playerOverlay.classList.contains("show")
){

closePlayer();

}

});


/* =====================================================
TELEGRAM POPUP
===================================================== */

(function(){

const tgOverlay =
document.getElementById("tgOverlay");


function closePopup(){
