<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://pl31358401.profitableratecpmnetwork.com/a3/81/41/a38141b4ff99f6ef8dbf9dc5f76bd86b.js"></script>

<title>@Cricmatchstream</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

body{
background:#0a0f1c;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

button{
font-family:'Poppins',sans-serif;
}

.match-tile{
background:#131d2f;
border-radius:32px;
border:1px solid #253247;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 15px 30px -10px rgba(0,0,0,0.8);
transition:.25s;
}

.match-tile:hover{
background:#17253b;
border-color:#3b82f6;
transform:scale(1.02) translateY(-4px);
box-shadow:0 25px 40px -8px #1e3a8a40;
}

.img-wrapper{
overflow:hidden;
height:210px;
position:relative;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
}

.live-badge{
background:#b91c1c;
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

.scheduled-badge{
background:rgba(0,0,0,.6);
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
}

.watch-btn{
background:#2563eb;
border-radius:50px;
padding:12px;
font-weight:600;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-top:12px;
cursor:pointer;
}

.watch-btn:hover{
background:#1d4ed8;
}

.not-live{
background:#334155;
cursor:not-allowed;
pointer-events:none;
}

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

*{
-webkit-tap-highlight-color:transparent;
}

.match-time{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}

/* ===== TELEGRAM ===== */

.social-links{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.social-link{
display:inline-flex;
align-items:center;
gap:6px;
padding:7px 14px;
background:#131d2f;
border:1px solid #253247;
border-radius:50px;
color:#e5e7eb;
font-size:12px;
font-weight:600;
text-decoration:none;
transition:all .25s;
white-space:nowrap;
font-family:'Poppins',sans-serif;
}

.social-link:hover{
background:#17253b;
border-color:#3b82f6;
color:#fff;
transform:translateY(-2px);
box-shadow:0 8px 20px -6px #1e3a8a60;
}

.social-link:active{
transform:translateY(0) scale(.96);
}

.social-link svg{
width:14px;
height:14px;
flex-shrink:0;
}

.social-link.tg-link svg{
fill:#29b6f6;
}

@media(max-width:420px){

.social-link{
padding:6px 11px;
font-size:11px;
gap:5px;
}

.social-link svg{
width:12px;
height:12px;
}

}

/* ===== TELEGRAM POPUP ===== */

#tgOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:none;
align-items:center;
justify-content:center;
z-index:999999;
padding:20px;
animation:fadeInPopup .4s cubic-bezier(.25,.8,.25,1);
}

#tgOverlay.show{
display:flex;
}

#tgCard{
width:100%;
max-width:400px;
background:linear-gradient(160deg,#121821,#0a0c0f);
border:1px solid rgba(79,195,247,.15);
border-radius:24px;
padding:36px 28px 28px;
box-shadow:
0 40px 80px rgba(0,0,0,.8),
0 0 60px rgba(79,195,247,.03);
text-align:center;
position:relative;
overflow:hidden;
}

#tgCard::before{
content:"";
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:radial-gradient(
circle at 30% 20%,
rgba(79,195,247,.04),
transparent 60%
);
pointer-events:none;
}

#tgIcon{
width:72px;
height:72px;
margin:0 auto 16px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#2AABEE,#229ED9);
box-shadow:0 0 40px rgba(42,171,238,.2);
position:relative;
z-index:1;
}

#tgIcon svg{
width:36px;
height:36px;
}

#tgCard h2{
margin:0 0 8px;
font-size:clamp(1.3rem,2.5vw,1.8rem);
font-weight:700;
color:#fff;
font-family:'Poppins',system-ui,sans-serif;
position:relative;
z-index:1;
letter-spacing:-.01em;
}

#tgCard p{
margin:0 0 24px;
color:#8e9baf;
font-size:clamp(.9rem,1.2vw,1.05rem);
line-height:1.6;
position:relative;
z-index:1;
}

.tgBtns{
display:flex;
gap:12px;
position:relative;
z-index:1;
}

.tgBtn{
flex:1;
height:48px;
border-radius:40px;
font-weight:700;
font-size:clamp(.85rem,1vw,1rem);
cursor:pointer;
transition:all .25s ease;
border:none;
font-family:'Poppins',sans-serif;
letter-spacing:.01em;
}

#joinNow{
background:linear-gradient(135deg,#4fc3f7,#2196f3);
color:#fff;
box-shadow:0 6px 24px rgba(79,195,247,.25);
}

#joinNow:hover{
transform:translateY(-2px);
box-shadow:0 10px 32px rgba(79,195,247,.35);
}

#joinedBtn{
background:rgba(255,255,255,.05);
color:#8e9baf;
border:1px solid rgba(255,255,255,.08);
}

#joinedBtn:hover{
background:rgba(255,255,255,.08);
color:#fff;
}

@keyframes fadeInPopup{

from{
opacity:0;
transform:scale(.95) translateY(12px);
}

to{
opacity:1;
transform:scale(1) translateY(0);
}

}

@media(max-width:480px){

#tgCard{
padding:24px 18px 20px;
border-radius:20px;
}

#tgIcon{
width:60px;
height:60px;
}

#tgIcon svg{
width:30px;
height:30px;
}

#tgCard h2{
font-size:1.2rem;
}

#tgCard p{
font-size:.85rem;
margin-bottom:18px;
}

.tgBtn{
height:42px;
font-size:.8rem;
}

}

</style>

</head>

<body class="p-5 max-w-7xl mx-auto">

<!-- HEADER -->

<div class="text-center mt-4 mb-8">

<div class="inline-flex items-center justify-center gap-3 bg-[#131d2f] py-3 px-7 rounded-full border border-blue-900/50">

<span class="text-3xl font-black tracking-tight text-white">
@Cricmatchstream
</span>

</div>

<p class="text-gray-500 text-sm mt-3 tracking-wide">
FANCODE LIVE WEB
</p>

<!-- TELEGRAM ONLY -->

<div class="social-links">

<a
href="https://t.me/cricmatchstream"
target="_blank"
rel="noopener"
class="social-link tg-link"
title="@cricmatchstream"
>

<svg
viewBox="0 0 24 24"
fill="currentColor"
aria-hidden="true"
>

<path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>

</svg>

<span>@cricmatchstream</span>

</a>

</div>

</div>


<!-- MATCH GRID -->

<div
id="matches-container"
class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6">
</div>


<!-- TELEGRAM POPUP -->

<div id="tgOverlay">

<div id="tgCard">

<div id="tgIcon">

<svg
viewBox="0 0 24 24"
fill="white"
width="36"
height="36"
>

<path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>

</svg>

</div>

<h2>
Join @cricmatchstream
</h2>

<p>
Get match links &amp; live updates delivered straight to your phone.
</p>

<div class="tgBtns">

<button class="tgBtn" id="joinedBtn">
Already Joined
</button>

<button class="tgBtn" id="joinNow">
Join Now
</button>

</div>

</div>

</div>


<script>

const DATA_URL =
'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';

const PLAYER_URL =
'fc-play.html?streams=';

const container =
document.getElementById("matches-container");

let allMatches = [];


/* ================================
   LOAD MATCHES
================================ */

fetch(DATA_URL)

.then(res => res.json())

.then(data => {

allMatches = data.matches || [];

container.innerHTML = "";


/* LIVE MATCHES FIRST */

const matches = allMatches.sort((a,b) => {

const aLive =
(a.status || "").toUpperCase() === "LIVE";

const bLive =
(b.status || "").toUpperCase() === "LIVE";

return bLive - aLive;

});


matches.forEach((m,index) => {

const isLive =
(m.status || "").toUpperCase() === "LIVE";

const img =
m.image ||
"https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";


const card =
document.createElement("div");

card.className =
"match-tile";


card.innerHTML = `

<div class="img-wrapper">

<img
src="${img}"
class="match-img"
loading="lazy"
>

${
isLive

? '<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'

: '<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'
}

</div>


<div class="p-5 flex flex-col flex-1">

<h3 class="text-xl font-bold">
${m.title || 'Match'}
</h3>

<div class="text-sm text-gray-400 mt-2">
${m.tournament || ''}
</div>

<div class="match-time">
${formatDate(m.startTime)}
</div>


${
isLive

? `
<div
onclick="openPlayer(${index})"
class="watch-btn"
>
<i class="fas fa-play"></i>
WATCH NOW
</div>
`

: `
<div class="watch-btn not-live">
<i class="far fa-clock"></i>
NOT LIVE
</div>
`
}

</div>

`;

container.appendChild(card);

});

})


.catch(() => {

container.innerHTML =
"<p class='text-center col-span-full'>Failed to load matches</p>";

});


/* ================================
   DATE FORMAT
================================ */

function formatDate(time){

if(!time) return "";


const parts =
time.match(
/(\d{2}):(\d{2}):(\d{2})\s*(AM|PM)\s*(\d{2})-(\d{2})-(\d{4})/i
);


if(parts){

let [
_,
hh,
mm,
ss,
ampm,
dd,
mo,
yyyy
] = parts;


hh = parseInt(hh,10);


if(
ampm.toUpperCase() === "PM" &&
hh < 12
){
hh += 12;
}


if(
ampm.toUpperCase() === "AM" &&
hh === 12
){
hh = 0;
}


const d =
new Date(
yyyy,
parseInt(mo,10)-1,
parseInt(dd,10),
hh,
parseInt(mm,10),
parseInt(ss,10)
);


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


const d =
new Date(time);


if(isNaN(d)){
return time;
}


return d.toLocaleString(
"en-IN",
{
day:"numeric",
month:"short",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* ================================
   OPEN PLAYER DIRECTLY
   NO QUALITY POPUP
================================ */

function openPlayer(index){

const match =
allMatches[index];


const streams =
match.auto_streams &&
match.auto_streams.ENGLISH &&
match.auto_streams.ENGLISH.streams;


if(
!streams ||
Object.keys(streams).length === 0
){

alert("Stream not available");

return;

}


/*
   Send ALL available qualities
   to fc-play.html.

   The player can then select/change
   quality while watching.
*/

const json =
JSON.stringify(streams);

const encoded =
btoa(
unescape(
encodeURIComponent(json)
)
);


window.location.href =
PLAYER_URL +
encodeURIComponent(encoded);

}


/* ================================
   TELEGRAM POPUP
================================ */

(function(){

const tgOverlay =
document.getElementById("tgOverlay");


function closePopup(){

tgOverlay.classList.remove("show");

}


/* Show after 3 seconds */

setTimeout(function(){

tgOverlay.classList.add("show");

},3000);


/* JOIN NOW */

document
.getElementById("joinNow")
.onclick = function(){

window.open(
"https://t.me/cricmatchstream",
"_blank"
);

closePopup();

};


/* ALREADY JOINED */

document
.getElementById("joinedBtn")
.onclick = function(){

closePopup();

};


/* CLICK BACKDROP */

tgOverlay.addEventListener(
"click",
function(e){

if(e.target === tgOverlay){

closePopup();

}

}
);


/* ESC */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "Escape" &&
tgOverlay.classList.contains("show")
){

closePopup();

}

}
);

})();

</script>

</body>

</html>
