<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cric Stream Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .player-page{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px}
    .player-wrap{width:min(1000px,100%)}
    .back{display:inline-block;color:#9aa3af;margin-bottom:12px}
    .video-box{background:#000;border:1px solid #252b34;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
    video{width:100%;height:100%;display:block}
    .note{color:#9aa3af;font-size:13px;line-height:1.5;margin-top:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">CS</div>
      <div><strong>Cric Stream</strong><span>Live Sports</span></div>
    </a>
  </header>

  <main class="player-page">
    <div class="player-wrap">
      <a class="back" href="index.html">← Back to events</a>
      <div class="video-box">
        <video id="video" controls playsinline></video>
      </div>
      <p id="message" class="note"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.15.7/dist/shaka-player.compiled.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    const streams = {
      "demo-live-cricket": "YOUR_AUTHORIZED_MPD_URL",
      "demo-football": "YOUR_AUTHORIZED_MPD_URL"
    };

    async function start() {
      const video = document.getElementById("video");
      const message = document.getElementById("message");
      const uri = streams[id];

      if (!uri || uri === "YOUR_AUTHORIZED_MPD_URL") {
        message.textContent = "Player is ready. Replace YOUR_AUTHORIZED_MPD_URL with a stream URL you are authorized to distribute.";
        return;
      }

      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        message.textContent = "This browser does not support the player.";
        return;
      }

      const player = new shaka.Player(video);
      player.addEventListener("error", e => {
        message.textContent = "Playback error. Check the authorized stream URL and CORS settings.";
        console.error(e.detail);
      });

      try {
        await player.load(uri);
      } catch (error) {
        message.textContent = "Could not load the stream.";
        console.error(error);
      }
    }

    document.addEventListener("DOMContentLoaded", start);
  </script>
</body>
</html>
